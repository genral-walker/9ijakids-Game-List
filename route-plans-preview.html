<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Plans - Optimized Preview</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #F9FAFB;
            min-height: 100vh;
            color: #212B36;
        }

        /* Color variables from your style guide */
        .text-text { color: #212B36; }
        .text-text-light { color: #637381; }
        .text-primary { color: #22962e; }
        .text-ams-orange { color: #ff6801; }
        .bg-primary { background-color: #22962e; }
        .bg-ams-orange { background-color: #ff6801; }
        .bg-primary-bg { background-color: #F9FFF2; }
        .bg-ams-gray-dark { background-color: #F9FAFB; }
        .border-primary { border-color: #22962e; }

        /* Layout styles */
        .container {
            padding: 1rem;
            min-height: 100vh;
            background-color: #F9FAFB;
        }

        .mb-6 { margin-bottom: 1.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .pt-3 { padding-top: 0.75rem; }
        .p-4 { padding: 1rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

        /* Typography */
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* Flexbox and Grid */
        .flex { display: flex; }
        .flex-1 { flex: 1 1 0%; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .flex-wrap { flex-wrap: wrap; }
        .grid { display: grid; }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

        /* Borders and Rounded */
        .border { border-width: 1px; border-style: solid; }
        .border-gray-100 { border-color: #f3f4f6; }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-t { border-top-width: 1px; border-top-style: solid; }
        .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-md { border-radius: 0.375rem; }
        .rounded-full { border-radius: 9999px; }

        /* Background and Shadow */
        .bg-white { background-color: #ffffff; }
        .bg-gray-50 { background-color: #f9fafb; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }

        /* Sizing */
        .w-4 { width: 1rem; }
        .w-5 { width: 1.25rem; }
        .w-8 { width: 2rem; }
        .w-12 { width: 3rem; }
        .w-full { width: 100%; }
        .h-4 { height: 1rem; }
        .h-5 { height: 1.25rem; }
        .h-8 { height: 2rem; }
        .h-12 { height: 3rem; }
        .h-px { height: 1px; }
        .min-w-48 { min-width: 12rem; }
        .min-w-64 { min-width: 16rem; }

        /* Form elements */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        select:focus {
            outline: 2px solid #22962e;
            border-color: #22962e;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Icons (simplified) */
        .icon {
            display: inline-block;
            vertical-align: middle;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .flex-wrap > * {
                flex-basis: 100%;
                min-width: unset;
            }
        }

        /* Custom styles for the route display */
        .route-arrow {
            width: 3rem;
            height: 1px;
            background-color: #22962e;
            position: relative;
        }

        .route-arrow::after {
            content: '→';
            position: absolute;
            right: -0.5rem;
            top: -0.5rem;
            color: #22962e;
            font-weight: bold;
        }

        .stat-card {
            text-align: center;
            padding: 0.75rem;
            background-color: #f9fafb;
            border-radius: 0.5rem;
        }

        .selection-tag {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            color: #637381;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-text mb-1">Route Plans</h1>
            <p class="text-text-light text-sm">Optimized Route Plans</p>
        </div>

        <!-- Compact Filter Bar -->
        <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-100 mb-6">
            <div class="flex items-center gap-4 flex-wrap">
                <div class="flex items-center gap-2 text-sm font-medium text-text">
                    <span class="icon">🗺️</span>
                    Route Filters:
                </div>
                
                <!-- State Selection -->
                <div class="flex-1 min-w-48">
                    <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md">
                        <option value="">Select State...</option>
                        <option value="Oyo" selected>Oyo</option>
                        <option value="Lagos">Lagos</option>
                        <option value="Kano">Kano</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div class="flex-1 min-w-48">
                    <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md">
                        <option value="">Select Date...</option>
                        <option value="2025-06-15" selected>Jun 15, 2025</option>
                        <option value="2025-06-18">Jun 18, 2025</option>
                    </select>
                </div>

                <!-- Vehicle Selection -->
                <div class="flex-1 min-w-64">
                    <select class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md">
                        <option value="">Select Vehicle...</option>
                        <option value="TRK-3012-Y" selected>TRK-3012-Y</option>
                        <option value="TRK-7743-K">TRK-7743-K</option>
                    </select>
                </div>
            </div>

            <!-- Compact Selection Summary -->
            <div class="mt-3 pt-3 border-t border-gray-100">
                <div class="flex items-center gap-4 text-xs text-text-light flex-wrap">
                    <span class="selection-tag">
                        <span class="icon">📍</span>
                        Oyo
                    </span>
                    <span class="selection-tag">
                        <span class="icon">📅</span>
                        Jun 15, 2025
                    </span>
                    <span class="selection-tag">
                        <span class="icon">🚛</span>
                        TRK-3012-Y
                    </span>
                </div>
            </div>
        </div>

        <!-- Route Plan Display -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-100">
            <!-- Route Header -->
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-text">TRK-3012-Y</h2>
                        <p class="text-text-light text-sm">Jun 15, 2025 • 450 km</p>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-text-light">Destination</div>
                        <div class="font-semibold text-text">Oyo</div>
                    </div>
                </div>
            </div>

            <!-- Route Display -->
            <div class="p-4">
                <div class="flex items-center justify-between bg-primary-bg rounded-lg p-4" style="background-color: #F9FFF2;">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center" style="background-color: #22962e;">
                            <span style="color: white; font-size: 12px;">📍</span>
                        </div>
                        <div>
                            <div class="font-medium text-text text-sm">From</div>
                            <div class="font-bold text-text">Enugu, Enugu</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 px-4">
                        <div class="route-arrow"></div>
                    </div>

                    <div class="flex items-center gap-3">
                        <div>
                            <div class="font-medium text-text text-sm text-right">To</div>
                            <div class="font-bold text-text text-right">Ibadan, Oyo</div>
                        </div>
                        <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: #ff6801;">
                            <span style="color: white; font-size: 12px;">📍</span>
                        </div>
                    </div>
                </div>

                <!-- Route Stats -->
                <div class="grid grid-cols-3 gap-3 mt-4">
                    <div class="stat-card">
                        <div class="text-lg font-bold text-text">450 km</div>
                        <div class="text-xs text-text-light">Distance</div>
                    </div>
                    <div class="stat-card">
                        <div class="text-lg font-bold text-text">1</div>
                        <div class="text-xs text-text-light">Route</div>
                    </div>
                    <div class="stat-card">
                        <div class="text-lg font-bold text-text">TRK-3012-Y</div>
                        <div class="text-xs text-text-light">Vehicle</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
